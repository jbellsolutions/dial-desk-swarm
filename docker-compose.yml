version: "3.8"

services:
  swarm:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./agents:/app/agents
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/open-swarm/get_metadata"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
